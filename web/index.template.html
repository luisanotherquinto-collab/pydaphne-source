:root {
  --navy: #06164a; --deep: #020a26; --cell: #16338f; --cell2: #0f2670; --edge: #3a5fd4;
  --gold: #ffd21a; --paper: #f2f5ff; --cyan: #86dcff; --dim: #93a4dd; --osd: #3cff66; --red: #e8322a; --grn: #1fb34a; --yel: #f2c500; --blu: #2b6cf0;
  --guide: "Arial Narrow", "Helvetica Neue", Arial, "Liberation Sans Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; color: var(--paper); font: 600 15px/1.25 var(--guide); overflow: hidden; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- televisor ---------- */
#stage { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; }
#tv { position: relative; background: #000; aspect-ratio: 4 / 3; height: 100%; max-width: 100%; max-height: 100%; overflow: hidden; transition: none; }
@media (max-aspect-ratio: 4/3) { #tv { width: 100%; height: auto; } }
#tv.wide { aspect-ratio: auto; width: 100%; height: 100%; }
#tv video, #tv canvas.layer, #tv .singecv { position: absolute; inset: 0; width: 100%; height: 100%; }
#tv video { object-fit: fill; background: #000; }
#tv canvas.layer, #tv .singecv { image-rendering: pixelated; }
#tv .singecv { image-rendering: auto; }
#tv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
#tv.crt::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 90px rgba(0,0,0,.75); }
#static { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 8; display: none; image-rendering: pixelated; }
#osd { position: absolute; top: 5%; right: 5%; z-index: 9; font: 64px/1 "SegOSD", monospace; color: var(--osd);
  text-shadow: 0 0 6px rgba(60,255,102,.7), 3px 3px 0 #000; display: none; letter-spacing: 4px; }
#marquee { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); z-index: 6; display: none; padding: 6px 14px; background: #120302; border: 2px solid #3a0c08; box-shadow: inset 0 0 12px #000; font: 26px/1 "SegOSD", monospace; letter-spacing: 4px; color: #ff3b1f; text-shadow: 0 0 8px rgba(255,60,30,.8); white-space: pre; }
#osdmsg { position: absolute; left: 5%; bottom: 7%; z-index: 9; font: 22px/1.2 "DaphneTT", monospace; color: var(--osd);
  text-shadow: 2px 2px 0 #000; display: none; max-width: 90%; }

/* tarjeta "sin disco" dentro del canal */
#card { position: absolute; z-index: 7; left: 3%; top: 3%; width: min(420px, 60%); background: linear-gradient(#123293, #0a1e66);
  border: 2px solid var(--edge); box-shadow: 0 0 0 2px #000, 6px 6px 0 rgba(0,0,0,.6); padding: 12px 14px 14px; display: none; }
#card h2 { margin: 0 0 2px; font-size: 22px; color: var(--gold); letter-spacing: .02em; }
#card .sub { color: var(--cyan); font-size: 13px; margin-bottom: 8px; }

.bevel { background: linear-gradient(#3b66e0, #1c3fa8); border: 2px solid; border-color: #8fb0ff #0a1c5c #0a1c5c #8fb0ff; padding: 6px 12px; color: #fff; font-weight: 700; }
.bevel:active { border-color: #0a1c5c #8fb0ff #8fb0ff #0a1c5c; }

/* ---------- guía (estilo receptor satelital de fines de los 90) ---------- */
#guide { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: #050505; padding: 1.2vh 1.6vw; gap: 6px; font-family: Arial, Helvetica, sans-serif; }

.bev { background: linear-gradient(#e2e2e2, #b4b4b4 55%, #9a9a9a); color: #000; border: 2px solid; border-color: #f4f4f4 #5a5a5a #5a5a5a #f4f4f4; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; }
#gtop { display: grid; grid-template-columns: 9% 21% 18% 1fr 12%; gap: 6px; height: 12vh; min-height: 64px; }
#gtop .lock svg { width: 60%; height: 60%; }
#gdate { font-size: clamp(14px, 2.6vh, 24px); line-height: 1.15; }
#glogo { background: #fff; border-color: #fff #777 #777 #fff; font: italic 700 clamp(22px, 5vh, 46px)/1 Georgia, "Times New Roman", serif; letter-spacing: -.04em; color: #1a1a1a; }
#glogo b { color: #c8102e; font-style: italic; }
#gfav { font-size: clamp(12px, 2.2vh, 20px); line-height: 1.2; }
#garrows { font-size: clamp(16px, 3vh, 26px); gap: 30%; }
#gtime { display: grid; grid-template-columns: 13% 1fr 1fr 1fr; gap: 3px; height: 5.2vh; min-height: 30px; }
#gtime div { background: linear-gradient(#3fb3b0, #1b8683 60%, #136b69); color: #fff; font-weight: 700; font-size: clamp(14px, 2.7vh, 24px); display: flex; align-items: center; padding-left: 12px; border: 2px solid; border-color: #8fe0de #0b4544 #0b4544 #8fe0de; }
#gtime div:first-child { justify-content: center; padding: 0; color: #eaffd0; }
#gtime div:nth-child(2)::before { content: "▶"; margin-right: 10px; font-size: .8em; }
#grows { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 3px; min-height: 0; }
.grow { display: grid; grid-template-columns: 13% 1fr 1fr 1fr; gap: 3px; flex: 0 0 auto; height: var(--rowh, 52px); }
.gch { background: linear-gradient(#cfcfcf, #9d9d9d 55%, #7d7d7d); border: 2px solid; border-color: #eee #4a4a4a #4a4a4a #eee; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; cursor: pointer; }
.gch .num { font-size: clamp(13px, 2.3vh, 21px); font-weight: 700; }
.gch .call { font-size: clamp(12px, 2.1vh, 19px); font-weight: 700; letter-spacing: .02em; }
.prog { position: relative; background: linear-gradient(#4b6b93, #2f4c72 60%, #25405f); border: 2px solid; border-color: #7f9cc4 #142538 #142538 #7f9cc4; color: #fff; font-weight: 700; font-size: clamp(13px, 2.5vh, 22px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 22px; overflow: hidden; line-height: 1.1; cursor: pointer; }
.prog span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.prog.cont::before, .prog.more::after { position: absolute; top: 50%; transform: translateY(-50%); font-size: 1.1em; }
.prog.cont::before { content: "◀"; left: 4px; }
.prog.more::after { content: "▶"; right: 4px; }
.prog.off { background: linear-gradient(#5b5f69, #3d414a 60%, #32353c); border-color: #8a8e98 #1a1c20 #1a1c20 #8a8e98; color: #c9ccd4; font-weight: 600; }
.prog.sel { background: linear-gradient(#ffffff, #e4e4e4 55%, #c9c9c9); color: #0e1d33; border-color: #fff #6a6a6a #6a6a6a #fff; }
.grow.tuned .gch { background: linear-gradient(#f3e27a, #d1b52c 55%, #a88b12); }
#ginfo { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; height: 20vh; min-height: 110px; align-items: stretch; }
#pip { position: relative; aspect-ratio: 4/3; height: 100%; background: #000; border: 2px solid; border-color: #5a5a5a #eee #eee #5a5a5a; overflow: hidden; }
#pipLabel { position: absolute; left: 6px; bottom: 4px; font: 13px "DaphneTT", monospace; color: var(--osd); text-shadow: 1px 1px 0 #000; z-index: 3; }
#gdesc { justify-content: flex-start; align-items: flex-start; flex-direction: column; text-align: left; padding: 8px 14px; overflow: hidden; }
#gtitle { font-size: clamp(15px, 2.8vh, 24px); }
#gmeta { font-size: clamp(12px, 2vh, 17px); color: #1d2f55; margin-top: 2px; }
#gtext { font-weight: 500; font-size: clamp(12px, 2vh, 16px); margin-top: 6px; line-height: 1.3; max-width: 80ch; }
#glegend { flex-direction: column; gap: 6px; padding: 6px 12px; font-size: clamp(11px, 1.8vh, 15px); align-items: flex-start; }
#glegend button { background: none; border: 0; color: inherit; font-weight: 700; padding: 0; text-align: left; }
.dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; border: 1px solid #333; }
#entry { font: 22px/1 "SegOSD", monospace; color: #0d6b26; min-height: 22px; }
#dlg { position: fixed; inset: 0; z-index: 45; display: none; place-items: center; background: rgba(0,0,0,.55); font-family: Arial, Helvetica, sans-serif; }
#dlg.on { display: grid; }
.dbox { display: block !important; text-align: left !important; width: min(520px, 92vw); padding: 16px 18px; }
.dbox h3 { margin: 0 0 6px; font-size: 22px; } .dbox p { margin: 6px 0 10px; font-weight: 500; }
.dbox .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.dbox input { flex: 1; min-width: 160px; font: 700 18px Arial, sans-serif; padding: 8px 10px; border: 2px inset #777; background: #fff; color: #000; }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.bevb { background: linear-gradient(#4b6b93, #2f4c72); color: #fff; font-weight: 700; padding: 8px 14px; border: 2px solid; border-color: #9fb8dd #142538 #142538 #9fb8dd; }
.bevb.gold { background: linear-gradient(#fff08a, #ffcc00); color: #1a1300; border-color: #fff #6a6a6a #6a6a6a #fff; }
#gfav { cursor: pointer; }
#stage.pip { z-index: 25; background: transparent; pointer-events: none; }
#stage.pip #card, #stage.pip #osd { display: none !important; }
@media (max-width: 700px) {
  #guide { padding: 6px; }
  #gtop { grid-template-columns: 1fr 1fr 1.3fr; height: 9vh; margin-right: 52px; } #gtop .lock, #garrows { display: none; }
  #gdate, #gfav { font-size: 13px; } #glogo { font-size: 26px; }

  #ginfo { grid-template-columns: 1fr; height: auto; } #pip, #glegend { display: none; }
  #gtitle { font-size: 16px; } #gtext { font-size: 13px; }

}
@media (max-width: 700px) and (orientation: portrait) { #stage { align-items: flex-start; padding-top: calc(62px + env(safe-area-inset-top, 0px)); } }
/* ---------- barra de información ---------- */
#banner { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 15; width: min(920px, 94vw);
  display: none; grid-template-columns: auto 1fr auto; background: linear-gradient(rgba(12,34,110,.94), rgba(4,14,58,.94));
  border-top: 4px solid var(--gold); box-shadow: 0 8px 0 rgba(0,0,0,.5); }
#banner.on { display: grid; }
#bnum { padding: 10px 16px; background: rgba(0,0,0,.35); text-align: center; }

#bnum span { color: var(--cyan); font-size: 14px; letter-spacing: .06em; }
#bmid { padding: 10px 14px; min-width: 0; }
#btitle { font-size: 24px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bsub { color: var(--cyan); font-size: 14px; margin-top: 2px; }

#mbox { width: min(760px, 94vw); max-height: 88vh; display: grid; grid-template-columns: 220px 1fr; background: var(--deep); border: 3px solid var(--edge); box-shadow: 10px 10px 0 rgba(0,0,0,.6); }
@media (max-width: 640px) { #mbox { grid-template-columns: 1fr; } #mnav { display: flex; overflow-x: auto; } }
#mnav { background: linear-gradient(#0e2a80, #081a55); padding: 10px 0; }
#mnav h3 { margin: 0 14px 10px; color: var(--gold); font-size: 20px; }
#mnav button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px; color: #fff; font-size: 16px; white-space: nowrap; }

#mbody label { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
#mbody p { color: #cfd7f5; max-width: 62ch; }
kbd { background: #0f2670; border: 1px solid var(--edge); padding: 0 5px; font: 13px "DaphneTT", monospace; color: var(--gold); }

/* ---------- control remoto flotante / táctil ---------- */
#pad { position: fixed; inset: auto 0 calc(8px + env(safe-area-inset-bottom, 0px)) 0; z-index: 16; display: none; justify-content: space-between; align-items: flex-end; padding: 0 12px; pointer-events: none; }

#pbtn { display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }

#toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 40; background: #000; border: 2px solid var(--gold); color: #fff; padding: 8px 14px; display: none; max-width: 90vw; font-weight: 600; }

/* ---------- control remoto Scientific-Atlanta 8650 ---------- */
#rbtn { position: fixed; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 26; width: 46px; height: 46px; border-radius: 50%; border: 2px solid #555; background: radial-gradient(#2a2a2a, #0b0b0b); opacity: .45; padding: 6px; }

#sa { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); top: calc(62px + env(safe-area-inset-top, 0px)); z-index: 27; width: 236px; display: none; background: linear-gradient(135deg, #1d1d1f, #0a0a0b); border-radius: 22px 22px 30px 30px; padding: 14px 12px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.7), inset 0 1px 0 #333; font: 700 11px/1 Arial, Helvetica, sans-serif; color: #e8e8e8; user-select: none; touch-action: manipulation; }
#sa.on { display: block; }
#sa label { display: flex; flex-direction: column; align-items: center; gap: 3px; letter-spacing: .02em; }
#sa .k { width: 40px; height: 26px; border-radius: 3px; border: 0; background: linear-gradient(#d2d2cf, #a9a9a5); box-shadow: 0 2px 0 #55554f, inset 0 1px 0 #eee; color: #555; font-size: 16px; line-height: 1; padding: 0; }
#sa .k:active { transform: translateY(2px); box-shadow: 0 0 0 #555; }
#sa .k.o { background: linear-gradient(#ff8a3d, #e5541a); box-shadow: 0 2px 0 #8a2e0a, inset 0 1px 0 #ffc49a; }

.sa-top { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.sa-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 6px; margin-bottom: 7px; }
.sa-right { border-left: 2px solid #ccc; padding-left: 8px; display: flex; flex-direction: column; gap: 3px; }

.sa-brand { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sa-brand small { font-size: 10px; } .sa-brand b { font: italic 700 18px Georgia, serif; }
@media (max-width: 700px), (max-height: 520px) { #sa { right: 50%; transform: translateX(50%); top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
#kbdSink { position: fixed; left: -200px; top: 0; width: 10px; height: 10px; opacity: 0; }
#pbtn button.kb { display: none; } body.kbgame #pbtn button.kb { display: block; }
#pbtn { grid-template-columns: repeat(2, 64px); }
/* ---------- ¿Quién está viendo? ---------- */
#prof { position: fixed; inset: 0; z-index: 44; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; background: radial-gradient(ellipse at center, #0c1f55 0%, #020716 70%); font-family: Arial, Helvetica, sans-serif; padding: 20px; overflow: auto; }

.pf { display: flex; flex-direction: column; align-items: center; gap: 8px; background: none; border: 0; color: #9aa6c7; font: 700 clamp(13px, 2vw, 18px) Arial, sans-serif; cursor: pointer; padding: 0; width: clamp(92px, 16vw, 150px); }
.pf .av { width: 100%; aspect-ratio: 1; border: 4px solid transparent; outline: 2px solid #000; display: grid; place-items: center; font-size: clamp(34px, 7vw, 64px); color: rgba(255,255,255,.9); text-shadow: 2px 2px 0 rgba(0,0,0,.4); background-size: cover; background-position: center; box-shadow: 4px 4px 0 rgba(0,0,0,.5); position: relative; }

.pf-btn { background: transparent; border: 2px solid #9aa6c7; color: #cfd8f2; font: 700 15px Arial; letter-spacing: .12em; padding: 9px 18px; }
.pf-btn.on { border-color: #ffd21a; color: #ffd21a; }
.pf-btn:hover, .pf-btn:focus-visible { border-color: #fff; color: #fff; }
.pf-ed { background: linear-gradient(#e2e2e2, #b4b4b4); border: 2px solid; border-color: #f4f4f4 #5a5a5a #5a5a5a #f4f4f4; color: #000; padding: 16px; width: min(460px, 94vw); display: grid; gap: 10px; }
.pf-ed h3 { margin: 0; } .pf-ed .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.pf-ed .av { width: 96px; aspect-ratio: 1; display: grid; place-items: center; font-size: 44px; color: #fff; background-size: cover; background-position: center; border: 2px solid #000; }
.sw { width: 30px; height: 30px; border: 2px solid #000; }
.sw.on { outline: 3px solid #ffd21a; }
.gav { width: 1.6em; height: 1.6em; display: inline-grid; place-items: center; vertical-align: middle; margin-right: 6px; background-size: cover; background-position: center; border: 1px solid #000; color: #fff; font-size: .8em; }
#ldmiss { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin; background: #0033ff; color: #fff; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 4%; }
#ldmiss .m1 { font-weight: 700; font-size: clamp(22px, 7.2vmin, 76px); line-height: 1.05; }

#vid { transform: translateZ(0); will-change: transform; backface-visibility: hidden; }
@media (prefers-reduced-motion: reduce) { #static { display: none !important; } }
/* @@CAB@@ */
#cab { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: #0b0b10; }
#cab .cab-box { position: relative; height: 100%; max-width: 100%; max-height: 100%; }
@supports not (aspect-ratio: 1) { #cab .cab-box { width: min(100vw, 71.6vh); height: min(139.7vw, 100vh); } }
#cab .cab-scr { position: absolute; background: #000; overflow: hidden; }

#card .clogo { display: block; max-width: 100%; max-height: 110px; margin: 2px auto 6px; border-radius: 4px; }

body.crtfx #ov { visibility: hidden !important; }

</style>
</head>
<body>
<div id="stage">
  <div id="tv" class="crt">
    <video id="vid" playsinline preload="auto"></video>
    <canvas id="ov" class="layer"></canvas>
    <div id="frames"></div>
    <canvas id="static" width="160" height="120"></canvas>
    <div id="osd"></div>
    <div id="osdmsg"></div>
    <div id="marquee"></div>
    <div id="card" role="dialog" aria-live="polite"></div>
  </div>
</div>

<section id="guide" aria-label="Guía de canales">
  <div id="gtop">
    <div class="bev lock"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 9.6-2" fill="none" stroke="#000" stroke-width="2.6"/><rect x="4" y="11" width="16" height="11" rx="1" fill="#000"/></svg></div>
    <div class="bev" id="gdate"></div>
    <div class="bev" id="glogo">d<b>d</b>n</div>
    <div class="bev" id="gfav">Lista de canales<br>TODOS</div>
    <div class="bev" id="garrows"><span>◀</span><span>▶</span></div>
  </div>
  <div id="gtime"></div>
  <div id="grows"></div>
  <div id="ginfo">
    <div id="pip"><div id="pipLabel"></div></div>
    <div class="bev" id="gdesc"><div id="gtitle"></div><div id="gmeta"></div><div id="gtext"></div></div>
    <div class="bev" id="glegend">
      <button data-k="ok"><span class="dot" style="background:#f2c500"></span>OK ver canal</button>
      <button data-k="info"><span class="dot" style="background:#1fb34a"></span>I información</button>
      <button data-k="menu"><span class="dot" style="background:#2b6cf0"></span>M menú</button>
      <button data-k="rec"><span class="dot" style="background:#9b59ff"></span>R récords · P jugador</button>
      <button data-k="close"><span class="dot" style="background:#e8322a"></span>Tab salir</button>
      <div id="entry"></div>
    </div>
  </div>
</section>

<div id="banner"><div id="bnum"><b></b><span></span></div><div id="bmid"><div id="btitle"></div><div id="bsub"></div><div id="bdesc"></div></div><div id="bright"><div id="bclock"></div><div id="bstat"></div></div></div>

<div id="menu"><div id="mbox"><nav id="mnav"></nav><div id="mbody"></div></div></div>

<button id="rbtn" aria-label="Control remoto" title="Control remoto">
  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="3" fill="#111" stroke="#bbb"/><circle cx="12" cy="6" r="1.6" fill="#f26b1d"/><g fill="#bbb"><rect x="9" y="9" width="2" height="1.6"/><rect x="13" y="9" width="2" height="1.6"/><rect x="9" y="12" width="2" height="1.6"/><rect x="13" y="12" width="2" height="1.6"/><rect x="9" y="15" width="6" height="1.6"/></g></svg>
</button>
<div id="sa" aria-label="Control remoto" role="group">
  <div class="sa-top">
    <div class="sa-left">
      <div class="sa-row"><label>POWER<button class="k o" data-r="power"></button></label><label>BUY<button class="k" data-r="buy"></button></label><label>SLEEP<button class="k" data-r="sleep"></button></label></div>
      <div class="sa-row"><label>1<button class="k" data-r="d1"></button></label><label>2<button class="k" data-r="d2"></button></label><label>3<button class="k" data-r="d3"></button></label></div>
      <div class="sa-row"><label>4<button class="k" data-r="d4"></button></label><label>5<button class="k" data-r="d5"></button></label><label>6<button class="k" data-r="d6"></button></label></div>
      <div class="sa-row"><label>7<button class="k" data-r="d7"></button></label><label>8<button class="k" data-r="d8"></button></label><label>9<button class="k" data-r="d9"></button></label></div>
      <div class="sa-row"><span></span><label>0<button class="k" data-r="d0"></button></label><span></span></div>
      <div class="sa-row"><label>MENU<button class="k o" data-r="menu"></button></label><label>⟶<button class="k o" data-r="guide"></button></label><label>SELECT<button class="k o" data-r="select"></button></label></div>
    </div>
    <div class="sa-right"><div class="sa-ch">CHANNEL</div>
      <label>FAV<button class="k t" data-r="fav"></button></label><label>LAST<button class="k t" data-r="last"></button></label>
      <label>CH▲<button class="k t" data-r="chup">∧</button></label><label>CH▼<button class="k t" data-r="chdn">∨</button></label>
      <label>DISPLAY<button class="k" data-r="display"></button></label></div>
  </div>
  <div class="sa-vol"><label>MUTE<button class="k w" data-r="mute"></button></label><label>VOL▼<button class="k w" data-r="voldn">∨</button></label><label>VOL▲<button class="k w" data-r="volup">∧</button></label></div>
  <div class="sa-brand"><small>8650-DDN</small><b>ddn</b> Disc Network</div>
</div>
<div id="prof"></div>
<input id="kbdSink" autocomplete="off" autocapitalize="characters" aria-hidden="true">
<input type="file" id="fAvatar" accept="image/*" hidden>

<div id="pad">
  <div id="dpad">
    <button data-sw="0" style="left:49px;top:0">▲</button>
    <button data-sw="1" style="left:0;top:49px">◀</button>
    <button data-sw="3" style="left:98px;top:49px">▶</button>
    <button data-sw="2" style="left:49px;top:98px">▼</button>
  </div>
  <div id="pbtn">
    <button class="s" data-sw="9">MONEDA</button><button class="s" data-sw="4">INICIO</button>
    <button class="s" data-sw="8">C</button><button class="s kb" id="padKbd">⌨</button>
    <button data-sw="7">B</button><button data-sw="6">ACCIÓN</button>
  </div>
</div>
<div id="toast"></div>
<div id="dlg"></div>

<input type="file" id="fVideo" accept="video/*,.txt,.m2v,.mpg,.mp4,.webm,.mkv,.ogv,.mov" multiple hidden>
<input type="file" id="fSinge" webkitdirectory directory multiple hidden>
<input type="file" id="fSingeFiles" multiple hidden>
<input type="file" id="fHtml" accept=".html,.htm,text/html" hidden>

<!--DDN_DATA-->
<!--DDN_GAL3-->
<script src="js/fengari-web.js"></script>
<script src="js/receptor.js"></script>
</body>
</html>
