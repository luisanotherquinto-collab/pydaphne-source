<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>The Act — recomp arcade</title>
<style>
  @font-face { font-family:'Archivo Black'; src:url('fonts/ArchivoBlack.woff2') format('woff2'); font-display:block; }
  :root { --ui:#c86a0b; }
  html, body { margin:0; height:100%; background:#000; color:#eee; font-family: Arial, Helvetica, sans-serif; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  body { padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); box-sizing:border-box; }
  #stage { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #box { position:relative; aspect-ratio: 4 / 3; height:100%; max-width:100%; max-height:100%; }
  @supports not (aspect-ratio: 4 / 3) { #box { width: min(100vw, 133.33vh); height: min(75vw, 100vh); } }
  #screen, #video { position:absolute; inset:0; width:100%; height:100%; background:#000; }
  #video { display:none; object-fit:contain; }
  body.scan #box::after { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px); }
  #loading { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,.6); gap:12px; font-weight:bold; letter-spacing:2px; }
  #loading .bar { width:46%; height:10px; border:2px solid #fff; border-radius:6px; overflow:hidden; }
  #loadbar { height:100%; width:0; background:var(--ui); transition:width .15s; }
  #boot { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; z-index:20; cursor:pointer; text-align:center; gap:14px; }
  #boot h1 { margin:0; font: italic 900 clamp(32px,7vw,64px) "Arial Black", Arial, sans-serif; color:#fff; text-shadow: 0 0 18px var(--ui); }
  #boot p { margin:0; color:#ccc; font-size:clamp(13px,2.4vw,18px); }
  #boot .blink { color:#ffb347; animation: bl 1s steps(2) infinite; font-weight:bold; letter-spacing:3px; }
  @keyframes bl { 50% { opacity:0; } }
  #err { position:absolute; left:50%; top:12px; transform:translateX(-50%); background:#a00; padding:8px 14px; border-radius:6px; display:none; z-index:30; }
  /* controles tactiles */
  #touch { display:none; position:absolute; z-index:10; pointer-events:none; }
  #touch * { pointer-events:auto; }
  .btn { width:74px; height:74px; border-radius:50%; border:3px solid #fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:14px; letter-spacing:1px; background:rgba(200,106,11,.55); color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.6); }
  .btn.small { width:46px; height:46px; font-size:11px; background:rgba(80,80,80,.5); border-width:2px; }
  #bStart { background:rgba(200,30,30,.65); }
  #knob { width:150px; height:150px; border-radius:50%; touch-action:none; }
  #knobc { width:100%; height:100%; }
  @media (pointer: coarse) {
    #touch { display:flex; }
    /* vertical: juego arriba, controles abajo */
    @media (orientation: portrait) {
      #stage { align-items:flex-start; padding-top:4vh; }
      #box { width:100%; height:auto; }
      #touch { left:0; right:0; bottom: calc(env(safe-area-inset-bottom,0) + 3vh); justify-content:space-around; align-items:center; }
      #knob { width:min(42vw,190px); height:min(42vw,190px); }
    }
    /* horizontal: controles sobre los lados */
    @media (orientation: landscape) {
      #touch { inset:0; justify-content:space-between; align-items:flex-end; padding:0 10px 10px; box-sizing:border-box; }
      #knob { opacity:.85; }
    }
  }
  .col { display:flex; flex-direction:column; gap:10px; align-items:center; }
  .row { display:flex; gap:10px; }
  #operator { display:none; position:absolute; z-index:40; left:50%; top:50%; transform:translate(-50%,-50%); width:min(560px,94vw); max-height:90vh; overflow:auto; background:#111; border:2px solid var(--ui); border-radius:10px; padding:16px; box-sizing:border-box; }
  #operator h2 { margin:0 0 10px; font: italic 900 22px "Arial Black", Arial; color:#ffb347; }
  .oprow { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #222; gap:10px; }
  .oprow select { background:#222; color:#fff; border:1px solid #555; padding:4px; border-radius:4px; }
  .opinfo { font-size:12px; color:#aaa; margin:12px 0; line-height:1.5; }
  #operator button { background:var(--ui); color:#fff; border:0; padding:8px 14px; border-radius:6px; font-weight:bold; margin-right:8px; cursor:pointer; }
  #opclose { position:absolute; right:10px; top:10px; }
</style>
</head>
<body>
<div id="stage">
  <div id="box">
    <canvas id="screen" width="640" height="480"></canvas>
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div id="loading"><div>CARGANDO</div><div class="bar"><div id="loadbar"></div></div></div>
  </div>
</div>
<div id="touch">
  <div class="col">
    <div class="row"><div class="btn small" id="bOp">OP</div><div class="btn small" id="bFS">⛶</div></div>
    <div class="btn" id="bCoin">COIN</div>
  </div>
  <div id="knob"><canvas id="knobc" width="200" height="200"></canvas></div>
  <div class="col"><div class="btn" id="bStart">START</div></div>
</div>
<div id="boot" style="font-family:'Archivo Black',Arial">
  <h1>THE ACT</h1>
  <p>Cecropia 2007 · recomp del port iOS 2012 al motor decaf original</p>
  <p class="blink">TOCA / PRESIONA UNA TECLA</p>
  <p style="font-size:12px;color:#888">←/→ o rueda = knob · 5 = moneda · 1 = start · F2 = operador · F = pantalla completa</p>
</div>
<div id="operator"><button id="opclose">✕</button><h2>MENÚ DE OPERADOR</h2><div id="opbody"></div></div>
<div id="err"></div>
<script src="js/build.js"></script>
<script src="js/vm.js"></script>
<script src="js/memimg.js"></script>
<script src="js/hlemap.js"></script>
<script src="js/recomp/engine.js"></script>
<script src="js/scene.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
